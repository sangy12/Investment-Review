# TradingAgents v0.7.1 opt-in profile; both tiers follow the user's 2026-11-10 selection.
llm_provider: chatgpt
deep_think_provider: chatgpt
quick_think_provider: chatgpt
# Confirmed by the signed-in plan's /models on 2026-11-08; user corrected Sol to 6.1.
deep_think_llm: gpt-6.1-sol
quick_think_llm: gpt-6.1-sol
# If unavailable, `ta-watchlist models` lists the signed-in plan's choices.
# Record the chosen replacement and reason here; never silently switch providers.
openai_reasoning_effort: high
quick_think_reasoning_effort: high
deep_think_reasoning_effort: max
max_debate_rounds: 2
max_risk_discuss_rounds: 2
output_language: Chinese
analysis_timezone: Asia/Shanghai
direct_analyst_evidence: true
max_tool_rounds: 20
checkpoint_enabled: true
data_vendors:
  core_stock_apis: yfinance
  fundamental_data: sec_edgar,yfinance
  news_data: yfinance
  macro_data: fred_public,fred
# A/H: tested statements, A-share news and explicitly named China macro series.
# US routing stays unchanged; HK news is not sent to the A-share numeric search.
china_tool_vendors:
  get_macro_indicators: akshare,fred_public,fred
  get_news: yfinance,akshare
market_tool_vendors:
  A_SHARE:
    get_balance_sheet: akshare,yfinance
    get_cashflow: akshare,yfinance
    get_income_statement: akshare,yfinance
  HK:
    get_balance_sheet: akshare,yfinance
    get_cashflow: akshare,yfinance
    get_income_statement: akshare,yfinance
statement_freshness:
  enabled: true
  compare_markets: [A_SHARE, HK]
  # Conservative alarm thresholds, not assertions of a mandatory report date.
  max_age_days: {US: 275, A_SHARE: 160, HK: 275}
  annual_max_age_days: 550
fundamental_review: true
research_sources:
  enabled: true
  hkex_official: true
  miaoxiang: true
  futu_public: true
  futu_community: true
  consensus_snapshots: true
  # Paid discovery refreshes only on a new financial reporting-period signature.
  # Unknown reporting periods never trigger a paid request.
  max_mcp_calls_per_ticker: 2
